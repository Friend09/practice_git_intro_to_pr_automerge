# Gate 1 — Repository Readiness
# Weekly health check: confirms `main` exists and branch protection is configured,
# then ACTIVELY ENFORCES readiness rather than merely observing it -- it flips the
# repo-level `allow_auto_merge` setting on when both conditions hold, and OFF the
# moment either regresses. This is what makes Gate 1 fail-closed at the platform
# level: automerge.yml (Chapter 17) can call `gh pr merge --auto` all it wants, but
# if allow_auto_merge is off, GitHub itself refuses the call -- no coordination
# between workflows is needed for Gate 1 to block. Writes readiness.json as a
# committed badge and opens an issue if readiness regresses. Runs on a schedule but
# also supports workflow_dispatch so it is testable in seconds rather than waiting
# a week (see .github/instructions/workflows.instructions.md).
# Chapter: learning_modules/chapter_14_gate1_repo_readiness.md

name: "Gate 1 — Repo Readiness"

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate Gate 1 readiness
        id: gate1
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          repo = os.environ["REPO"]

          def gh(*args):
              result = subprocess.run(["gh", *args], capture_output=True, text=True)
              return result.returncode, result.stdout, result.stderr

          # NOTE: the detailed protection sub-resource
          # (repos/{repo}/branches/main/protection, which lists required_status_checks
          # contexts) requires Administration permission on the repo -- a scope
          # GITHUB_TOKEN can NEVER hold, no matter what `permissions:` block grants it
          # (verified empirically: this call returns 403 here even with
          # `contents: write`). Reading it for real needs a PAT or GitHub App token
          # (Chapter 10). GITHUB_TOKEN CAN read the basic branch resource, which
          # exposes a lighter-weight `protected: true/false` boolean -- enough to
          # confirm *some* protection is configured, if not exactly which checks.
          rc, out, _ = gh("api", f"repos/{repo}/branches/main")
          main_exists = rc == 0
          protection_configured = False
          if main_exists:
              try:
                  protection_configured = bool(json.loads(out).get("protected", False))
              except json.JSONDecodeError:
                  pass

          # Which checks are required cannot be read with GITHUB_TOKEN alone (see
          # note above) -- required_checks_registered mirrors protection_configured
          # here as the honest, token-limited signal. A PRA_BOT_TOKEN PAT would let
          # this distinguish "protected" from "protected AND has required checks".
          required_checks_registered = protection_configured

          # ENFORCE, don't just observe: auto-merge should only be possible when
          # main exists and is protected. Flip the repo setting to match, in
          # either direction -- this is Gate 1 acting, not just reporting.
          desired_auto_merge = main_exists and protection_configured
          gh("api", "-X", "PATCH", f"repos/{repo}", "-F", f"allow_auto_merge={str(desired_auto_merge).lower()}")

          rc, out, _ = gh("api", f"repos/{repo}")
          auto_merge_enabled = False
          if rc == 0:
              try:
                  auto_merge_enabled = json.loads(out).get("allow_auto_merge", False)
              except json.JSONDecodeError:
                  pass

          readiness = {
              "main_exists": main_exists,
              "protection_configured": protection_configured,
              "required_checks_registered": required_checks_registered,
              "auto_merge_enabled": auto_merge_enabled,
          }
          readiness["ready"] = all(
              [main_exists, protection_configured, required_checks_registered, auto_merge_enabled]
          )

          with open("readiness.json", "w") as f:
              json.dump(readiness, f, indent=2)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write("## Gate 1 -- Repo Readiness\n\n")
                  f.write("| Check | Status |\n|---|---|\n")
                  for key, value in readiness.items():
                      if key == "ready":
                          continue
                      f.write(f"| {key} | {'PASS' if value else 'FAIL'} |\n")
                  overall = "READY" if readiness["ready"] else "NOT READY"
                  f.write(f"\n**Overall: {overall}**\n")

          print(json.dumps(readiness, indent=2))
          if not readiness["ready"]:
              sys.exit(1)
          PY

      - name: Publish readiness badge to gate-status branch
        # main is protected and requires the "test" status check on every push --
        # including this bot's -- so a direct push here would always be rejected
        # (verified empirically: GH006 "Required status check 'test' is expected").
        # gate-status is a dedicated, unprotected branch that exists only to carry
        # this one file; automerge.yml reads it from there rather than from main.
        if: always()
        run: |
          git config user.name "gate1-bot"
          git config user.email "gate1-bot@users.noreply.github.com"
          git checkout -B gate-status
          git add readiness.json
          git diff --cached --quiet || git commit -m "chore: update Gate 1 readiness badge [skip ci]"
          git push --force origin gate-status

      - name: Open issue on regression
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Gate 1: repository readiness regressed" \
            --body "The weekly repo-health check failed. See the run for detail: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "automated" || echo "issue create failed (label may not exist yet) -- see run summary"
